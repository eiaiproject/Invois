    <meta name="theme-color" content="#1A1B16" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint to avoid a color flash.
      (function () {
        try {
          var pref = localStorage.getItem('invois-theme');
          var dark = pref === 'dark' || ((pref === null || pref === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (err) {
          document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
