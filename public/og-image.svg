  <text x="800" y="272" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#596949">Export PDF &amp; Share</text>
  <text x="800" y="296" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#595449">Download as PDF or share via</text>
